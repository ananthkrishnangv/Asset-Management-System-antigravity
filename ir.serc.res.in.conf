<VirtualHost *:80>
    ServerName ir.serc.res.in
    ServerAlias www.ir.serc.res.in
    DocumentRoot /var/www/html
    
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Redirect to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    
    ErrorLog /var/log/httpd/ir.serc.res.in-error_log
    CustomLog /var/log/httpd/ir.serc.res.in-access_log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ir.serc.res.in
    ServerAlias www.ir.serc.res.in
    DocumentRoot /var/www/html
    
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # PHP settings
        DirectoryIndex index.php index.html
    </Directory>
    
    # SSL Configuration - Using provided certificates
    SSLEngine on
    SSLCertificateFile /var/www/html/SSL\ Key/cert.crt
    SSLCertificateKeyFile /var/www/html/SSL\ Key/cert.key
    
    # SSL Protocol and Cipher Settings
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder on
    SSLCompression off
    
    # Security Headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    ErrorLog /var/log/httpd/ir.serc.res.in-ssl-error_log
    CustomLog /var/log/httpd/ir.serc.res.in-ssl-access_log combined
</VirtualHost>
